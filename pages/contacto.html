<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Commissioner:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto de Aromaterapia</title>
  </head>
  <body>
    <header class="bg-primario">
      <div class="div-logo">
        <a class="logo" href="../index.html">Aromaterapia</a>
      </div>

      <nav class="header-nav">
        <ul>
          <li>
            <a href="../index.html">Inicio</a>
          </li>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Contactanos</h1>

      <form action="https://formspree.io/f/xaenojbe" method="POST">
        <fieldset class="fieldset-contacto">
          <legend>Dejanos tu consulta</legend>

          <label for="nombre">
            Nombre:
            <input
              id="nombre"
              name="nombre"
              type="text"
              maxlength="25"
              required
            />
          </label>

          <label for="apellido">
            Apellido:
            <input
              id="apellido"
              name="apellido"
              type="text"
              maxlength="25"
              required
            />
          </label>

          <label for="email">
            Tu e-mail:
            <input
              id="email"
              type="email"
              name="email"
              placeholder="nombre@gmail.com"
              required
            />
          </label>

          <label for="fecha">
            Fecha de consulta:
            <input id="fecha" name="fecha" type="date" required />
          </label>

          <label class="consulta" for="mensaje">
            Tu consulta:
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              cols="50"
              placeholder="Hola me comunico para..."
              required
              maxlength="1000"
            ></textarea>
          </label>
          <!-- boton de enviar -->
          <button class="btn" type="submit">Enviar</button>
        </fieldset>
      </form>
    </main>

    <footer class="bg-secundario">
      <!-- pie de pagina -->
      <h1>Sitio informativo</h1>
      <p>Muestra de productos aromáticos.</p>
      <nav class="footer-list">
        <ul>
          <li>
            <img
              src="../images/whatsapp.png"
              alt="logo de whatsapp"
              width="50"
            />
          </li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
