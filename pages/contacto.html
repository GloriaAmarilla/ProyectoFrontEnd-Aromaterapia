<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacto</title>
  </head>
  <body>
    <header>
      <h1>Aromaterapia</h1>

      <nav>
        <ul>
          <li>
            <a href="/index.html">Inicio</a>
          </li>
          <li>
            <a href="./contacto.html">Contacto</a>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1>Contactanos</h1>

      <form action="https://formspree.io/f/xaenojbe" method="POST">
        <fieldset>
          <legend>Dejanos tu consulta</legend>

          <label for="fecha">
            Fecha de consulta:
            <input id="fecha" name="fecha" type="date" required />
          </label>

          <label for="email">
            Tu e-mail:
            <input
              id="email"
              type="email"
              name="email"
              placeholder="nombre@gmail.com"
              required
            />
          </label>

          <label for="mensaje">
            Tu consulta:
            <textarea
              id="mensaje"
              name="mensaje"
              rows="4"
              cols="50"
              placeholder="Hola me comunico para..."
              required
              maxlength="1000"
            ></textarea>
          </label>
          <!-- boton de enviar -->
          <button type="submit">Enviar</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <!-- pie de pagina -->
      <h1>Sitio informativo</h1>
      <p>Muestra de productos aromáticos.</p>
    </footer>
  </body>
</html>
